<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisionCraft Preview - ${shareId}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    body { margin: 0; background-color: #0f172a; font-family: ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    try {
      ${pipelineResult.compiledJs}
      const Comp = window[${JSON.stringify(pipelineResult.compName)}];
      if (Comp) {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(Comp));
      } else {
        document.getElementById('root').innerHTML = '<div style="color:white;padding:20px;">Component failed to mount.</div>';
      }
    } catch(err) {
      document.getElementById('root').innerHTML = '<div style="color:#f87171;padding:20px;font-family:monospace;">Render Error: ' + err.message + '</div>';
    }
  </script>
</body>
</html>
