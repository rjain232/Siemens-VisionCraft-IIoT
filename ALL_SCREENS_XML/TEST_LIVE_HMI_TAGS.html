<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siemens VisionCraft IIOT - Live HMI Tag Test Bench</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-6 md:p-10 min-h-screen font-sans">
  <div class="w-full max-w-6xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-6 mb-8">
      <div>
        <div class="flex items-center gap-3">
          <span id="connDot" class="w-3.5 h-3.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <h1 class="text-2xl font-bold text-white">Siemens Live HMI Tag Test Bench</h1>
        </div>
        <p id="connStatus" class="text-xs font-mono text-emerald-400 mt-1">Connected to ws://localhost:5055/ws/siemens-hmi | PLC: 192.168.10.10</p>
      </div>
      <div class="flex gap-3">
        <a href="./INDEX_ALL_SCREENS.html" class="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-cyan-400 border border-slate-800 text-xs font-semibold transition">&rarr; Back to 211 Screens</a>
      </div>
    </div>

    <!-- Controls -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 mb-8 shadow-xl">
      <h2 class="text-xs font-bold uppercase tracking-wider text-cyan-400 mb-4">Interactive HMI Tag Actuation</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
        <button id="btnStart" class="p-4 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 text-white font-bold text-xs uppercase tracking-wider border border-emerald-500/40 transition active:scale-95 text-left">
          <div class="text-emerald-400 text-sm mb-1">&#9658; START LINE AUTO</div>
          <div class="text-[0.7rem] font-mono text-slate-400">Line_Auto_Running = true</div>
        </button>
        <button id="btnStop" class="p-4 rounded-xl bg-rose-600/20 hover:bg-rose-600/30 text-white font-bold text-xs uppercase tracking-wider border border-rose-500/40 transition active:scale-95 text-left">
          <div class="text-rose-400 text-sm mb-1">&#9632; STOP LINE AUTO</div>
          <div class="text-[0.7rem] font-mono text-slate-400">Line_Auto_Running = false</div>
        </button>
        <button id="btnWeld" class="p-4 rounded-xl bg-cyan-600/20 hover:bg-cyan-600/30 text-white font-bold text-xs uppercase tracking-wider border border-cyan-500/40 transition active:scale-95 text-left">
          <div class="text-cyan-400 text-sm mb-1">&#9881; TRIGGER WELD CYCLE</div>
          <div class="text-[0.7rem] font-mono text-slate-400">BSL015_R01_Status = 2</div>
        </button>
        <button id="btnHome" class="p-4 rounded-xl bg-amber-600/20 hover:bg-amber-600/30 text-white font-bold text-xs uppercase tracking-wider border border-amber-500/40 transition active:scale-95 text-left">
          <div class="text-amber-400 text-sm mb-1">&#10227; RESET HOME POS</div>
          <div class="text-[0.7rem] font-mono text-slate-400">BSL015_R01_Status = 1</div>
        </button>
      </div>
    </div>

    <!-- Live Tags Table -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl overflow-hidden">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Real-Time Process Variables (S7-1500)</h2>
        <span class="text-xs font-mono text-cyan-400 bg-cyan-950/60 px-2.5 py-1 rounded-md border border-cyan-800/40">500ms Cyclic Stream</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="border-b border-slate-800 text-slate-500 font-mono uppercase tracking-wider">
              <th class="py-3 px-4">PLC Symbolic Tag</th>
              <th class="py-3 px-4">Live Value</th>
              <th class="py-3 px-4">Address / DB Mapping</th>
              <th class="py-3 px-4">Status</th>
            </tr>
          </thead>
          <tbody id="tagTableBody" class="divide-y divide-slate-800/60 font-mono">
            <!-- Dynamically populated rows -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const wsUrl = "ws://localhost:5055/ws/siemens-hmi";
    let ws = null;
    const tagValues = {};

    function connect() {
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        document.getElementById('connDot').className = "w-3.5 h-3.5 rounded-full bg-emerald-500 animate-pulse";
        document.getElementById('connStatus').innerText = "Connected to " + wsUrl + " | PLC: 192.168.10.10";
        document.getElementById('connStatus').className = "text-xs font-mono text-emerald-400 mt-1";
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'SNAPSHOT' || msg.type === 'UPDATE') {
            for (const [tag, val] of Object.entries(msg.tags)) {
              tagValues[tag] = val;
              renderRow(tag, val);
            }
          }
        } catch (e) {
          console.error("Parse error:", e);
        }
      };

      ws.onclose = () => {
        document.getElementById('connDot').className = "w-3.5 h-3.5 rounded-full bg-rose-500";
        document.getElementById('connStatus').innerText = "Disconnected - Retrying in 2s...";
        document.getElementById('connStatus').className = "text-xs font-mono text-rose-400 mt-1";
        setTimeout(connect, 2000);
      };
    }

    function renderRow(tag, val) {
      const tbody = document.getElementById('tagTableBody');
      let row = document.getElementById('row_' + tag);
      
      let badgeColor = "bg-slate-800 text-slate-200 border-slate-700";
      if (val === true) badgeColor = "bg-emerald-950/80 text-emerald-300 border-emerald-500/40";
      if (val === false) badgeColor = "bg-slate-800 text-slate-400 border-slate-700";
      if (typeof val === 'number') badgeColor = "bg-cyan-950/80 text-cyan-300 border-cyan-500/40";

      if (!row) {
        row = document.createElement('tr');
        row.id = 'row_' + tag;
        row.className = "hover:bg-slate-800/40 transition";
        row.innerHTML = `
          <td class="py-3 px-4 font-semibold text-slate-200">${tag}</td>
          <td class="py-3 px-4"><span id="val_${tag}" class="px-2.5 py-1 rounded-md border font-bold ${badgeColor}">${val}</span></td>
          <td class="py-3 px-4 text-slate-400 text-[11px]">${getMapping(tag)}</td>
          <td class="py-3 px-4"><span class="text-[10px] text-emerald-400 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> LIVE</span></td>
        `;
        tbody.appendChild(row);
      } else {
        const span = document.getElementById('val_' + tag);
        if (span) {
          span.innerText = val;
          span.className = `px-2.5 py-1 rounded-md border font-bold ${badgeColor}`;
        }
      }
    }

    function getMapping(tag) {
      if (tag === 'Line_Auto_Running') return 'GlobalDB.AutoMode (DB100.DBX0.0)';
      if (tag === 'BSL015_R01_Status') return 'Robot_Kuka.Status (DB200.DBW2)';
      if (tag.includes('ActPos')) return 'SEW_Drive.SEW_MB220_XM1.ActualPosition';
      if (tag.includes('Speed')) return 'SEW_Drive.SEW_MB210_U1.Velocity';
      return 'Siemens.S7-1500.OptimizedDB';
    }

    document.getElementById('btnStart').onclick = () => ws && ws.send(JSON.stringify({action: 'WRITE_TAG', tag: 'Line_Auto_Running', value: true}));
    document.getElementById('btnStop').onclick = () => ws && ws.send(JSON.stringify({action: 'WRITE_TAG', tag: 'Line_Auto_Running', value: false}));
    document.getElementById('btnWeld').onclick = () => ws && ws.send(JSON.stringify({action: 'WRITE_TAG', tag: 'BSL015_R01_Status', value: 2}));
    document.getElementById('btnHome').onclick = () => ws && ws.send(JSON.stringify({action: 'WRITE_TAG', tag: 'BSL015_R01_Status', value: 1}));

    connect();
  </script>
</body>
</html>
