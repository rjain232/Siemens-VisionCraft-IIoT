<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siemens TIA Portal V20 - All Screens Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b1120; color: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="p-6 md:p-10 flex flex-col items-center min-h-screen">
  <div class="w-full max-w-6xl mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-6">
    <div>
      <div class="flex items-center gap-2 mb-1">
        <span class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></span>
        <h1 class="text-2xl font-bold text-white tracking-tight">Siemens TIA Portal V20 Screens Catalog</h1>
      </div>
      <p class="text-sm text-slate-400">211 Standalone Interactive HTML Screens &bull; 1-Click Browser Preview</p>
    </div>
    <div class="flex items-center gap-3">
      <input type="text" id="searchBox" placeholder="Search 211 screens (e.g. Valve8Pos, Robot, Alarm)..." class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 font-mono w-72 md:w-80 shadow-inner" />
    </div>
  </div>

  <div id="grid" class="w-full max-w-6xl grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
    <!-- Populated via script -->
  </div>

  <script>
    fetch('./screens_list.json')
      .then(r => r.json())
      .then(screens => {
        const grid = document.getElementById('grid');
        const search = document.getElementById('searchBox');

        function render(list) {
          grid.innerHTML = list.map(s => \`
            <a href="./\${encodeURIComponent(s)}.html" target="_blank" class="p-3.5 rounded-xl bg-slate-900/80 hover:bg-slate-800/90 border border-slate-800 hover:border-cyan-500/50 transition flex items-center justify-between group shadow-sm hover:shadow-cyan-500/10 hover:shadow-lg">
              <div class="flex items-center gap-2.5 overflow-hidden">
                <span class="text-base text-cyan-400 group-hover:scale-110 transition">🖥️</span>
                <span class="text-xs font-semibold text-slate-200 group-hover:text-cyan-300 truncate font-mono">\${s}</span>
              </div>
              <span class="text-[10px] text-slate-500 group-hover:text-cyan-400 font-mono flex items-center gap-1 flex-shrink-0">
                <span>Open</span>
                <span>&rarr;</span>
              </span>
            </a>
          \`).join('');
        }

        render(screens);

        search.addEventListener('input', (e) => {
          const q = e.target.value.toLowerCase().trim();
          const filtered = screens.filter(s => s.toLowerCase().includes(q));
          render(filtered);
        });
      })
      .catch(() => {
        // Fallback static list
      });
  </script>
</body>
</html>
